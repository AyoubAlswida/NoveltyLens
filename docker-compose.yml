# Local development infrastructure.
#
# Brings up the two services the backend needs to serve a single request:
#
#   - Qdrant, the vector store backing the graph's semantic-search branch.
#     `semantic_search` reads it and `index_patents` writes it, with no fallback
#     path on either side.
#   - PostgreSQL, which holds the login accounts and every completed run. A run
#     is stored before its result is sent (graph/pipeline.py's persist_run) and
#     GET /api/history reads it back, again with no fallback.
#
#   docker compose up -d --wait # from the repository root; returns once both are healthy
#   docker compose ps           # show status
#   docker compose down         # stop, keep data
#   docker compose down -v      # stop, wipe the stored reports AND the indexed corpus
#
# After the first `up`, apply the schema once: `cd backend && python migrate.py`.
# That also seeds the demo login (testnovelty@gmail.com / ABC123).
#
# The backend and frontend ARE containerized too (backend/Dockerfile,
# frontend/Dockerfile) - `docker compose up --build` brings up the whole
# stack. Running them natively with `python server.py` / `npm run dev` still
# works fine for hot-reload during active development; nothing requires the
# containerized versions.
#
# Credentials below are local-development only and deliberately committed. Real
# credentials belong in backend/.env, which is gitignored.

services:
  postgres:
    image: postgres:17.10-alpine
    container_name: agenticai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenticai
      POSTGRES_PASSWORD: agenticai
      POSTGRES_DB: agenticai
    ports:
      # Bound to loopback so the database is not exposed on the local network.
      # If you already run PostgreSQL on 5432, change the host side to 5433 here
      # and set DATABASE_URL in backend/.env to match.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticai -d agenticai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  qdrant:
    # Keep this in step with the qdrant-client version in backend/requirements.txt.
    # The client warns (and can misbehave) when the server is more than a minor
    # version away from it.
    image: qdrant/qdrant:v1.18.3
    container_name: agenticai-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"  # HTTP / REST
      - "127.0.0.1:6334:6334"  # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    # Qdrant keeps vectors in RAM by default (Qwen3-Embedding-4B is 2560-dim
    # float32 = 10 KB/point, so ~1 GB per 100k patents) and the container was
    # previously unbounded - a runaway corpus would have taken the host down with
    # it rather than failing in one place. 2 GB now leaves headroom for roughly
    # 200k patents, down from 400k when the project embedded at 1024 dims with
    # bge-large; raise it deliberately rather than removing it. Note payloads are
    # on disk (`on_disk_payload`) and store full patent text at ~273 KB average,
    # so disk grows much faster than memory - that is the number to watch.
    mem_limit: 2g
    healthcheck:
      # The image ships no curl/wget/nc, but it does have bash, so probe /readyz
      # over bash's /dev/tcp. Must be CMD+bash, not CMD-SHELL: CMD-SHELL runs
      # /bin/sh, and /dev/tcp is a bash builtin that sh does not provide.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "200 OK" <&3']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: agenticai-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Reach the other containers by service name instead of the .env
      # file's 127.0.0.1 defaults - everything else (HF_TOKEN, SERPAPI_KEY,
      # AUTH_SECRET, ...) still comes from backend/.env above.
      DATABASE_URL: postgresql://agenticai:agenticai@postgres:5432/agenticai
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: agenticai-frontend
    restart: unless-stopped
    environment:
      # Where the BROWSER should reach the backend - not the Docker network,
      # since the browser runs outside it.
      API_URL: "${FRONTEND_API_URL:-http://localhost:8001}"
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  qdrant-data:

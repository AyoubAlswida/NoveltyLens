# Local development infrastructure.
#
# Brings up Qdrant, the vector store backing the graph's semantic-search branch.
# It is required to run the backend at all: `semantic_search` reads it and
# `index_patents` writes it, and neither has a fallback path.
#
#   docker compose up -d --wait # from the repository root; returns once healthy
#   docker compose ps           # show status
#   docker compose down         # stop, keep data
#   docker compose down -v      # stop, wipe the indexed patent corpus
#
# PostgreSQL used to live here too, for the legacy pipeline's caches and stored
# reports. Both the legacy pipeline and Postgres have been retired; the corpus in
# Qdrant is now the only persistent state this project keeps.
#
# The backend and frontend are NOT containerized; keep running them with
# `python server.py` and `npm run dev` as before.

services:
  qdrant:
    # Keep this in step with the qdrant-client version in backend/requirements.txt.
    # The client warns (and can misbehave) when the server is more than a minor
    # version away from it.
    image: qdrant/qdrant:v1.18.3
    container_name: agenticai-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"  # HTTP / REST
      - "127.0.0.1:6334:6334"  # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    # Qdrant keeps vectors in RAM by default (1024-dim float32 = 4 KB/point, so
    # ~0.4 GB per 100k patents) and the container was previously unbounded - a
    # runaway corpus would have taken the host down with it rather than failing
    # in one place. 2 GB leaves headroom for roughly 400k patents; raise it
    # deliberately rather than removing it. Note payloads are on disk
    # (`on_disk_payload`) and store full patent text at ~273 KB average, so disk
    # grows much faster than memory - that is the number to watch.
    mem_limit: 2g
    healthcheck:
      # The image ships no curl/wget/nc, but it does have bash, so probe /readyz
      # over bash's /dev/tcp. Must be CMD+bash, not CMD-SHELL: CMD-SHELL runs
      # /bin/sh, and /dev/tcp is a bash builtin that sh does not provide.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "200 OK" <&3']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  qdrant-data:

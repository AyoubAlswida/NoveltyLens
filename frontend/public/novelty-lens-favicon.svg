<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Novelty Lens">
  <title>Novelty Lens</title>
  <!--
    Small-size cut, for the browser tab. Same composition as novelty-lens-mark.svg with
    the dot grid reduced from sixteen to four and every stroke thickened: at 16px the fine
    scan-line and the full grid fill in to a smudge. Use the full mark anywhere above ~32px.
  -->
  <defs>
    <linearGradient id="nlFav" gradientUnits="userSpaceOnUse" x1="6" y1="32" x2="58" y2="32">
      <stop offset="0" stop-color="#643278"/>
      <stop offset="1" stop-color="#26A8AB"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#nlFav)" stroke-width="5" stroke-linecap="round">
    <path d="M23,9 H14 Q9,9 9,14 V23"/>
    <path d="M41,9 H50 Q55,9 55,14 V23"/>
    <path d="M23,55 H14 Q9,55 9,50 V41"/>
    <path d="M41,55 H50 Q55,55 55,50 V41"/>
  </g>

  <g fill="url(#nlFav)">
    <circle cx="24" cy="24" r="3.4"/>
    <circle cx="40" cy="24" r="3.4"/>
    <circle cx="24" cy="40" r="3.4"/>
    <circle cx="40" cy="40" r="3.4"/>
  </g>

  <circle cx="32" cy="32" r="6.2" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="4.3" fill="url(#nlFav)"/>
</svg>

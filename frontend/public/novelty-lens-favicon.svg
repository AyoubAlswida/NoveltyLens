<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Novelty Lens">
  <title>Novelty Lens</title>
  <!--
    Small-size cut, for the browser tab. Same composition as novelty-lens-mark.svg with
    the cluster reduced from seven dots to three and every stroke thickened: at 16px the
    full cluster fills in to a smudge and the 4.2-unit ring goes wispy. Use the full mark
    anywhere above ~32px.
  -->
  <defs>
    <linearGradient id="nlFav" gradientUnits="userSpaceOnUse" x1="10" y1="8" x2="54" y2="56">
      <stop offset="0" stop-color="#155BD7"/>
      <stop offset="0.55" stop-color="#12B8B2"/>
      <stop offset="1" stop-color="#08A873"/>
    </linearGradient>
  </defs>

  <circle cx="25.5" cy="37.5" r="18" fill="none" stroke="url(#nlFav)" stroke-width="5.5"/>

  <g fill="url(#nlFav)">
    <circle cx="19.5" cy="32.5" r="4.5"/>
    <circle cx="29.5" cy="40.5" r="3.6" opacity="0.8"/>
    <circle cx="18.5" cy="44.5" r="3.2" opacity="0.62"/>
  </g>

  <circle cx="49.5" cy="15.5" r="7.5" fill="none" stroke="#08A873" stroke-width="4.2"/>
</svg>

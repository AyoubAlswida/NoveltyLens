<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Novelty Lens">
  <title>Novelty Lens</title>
  <!--
    Reversed cut of novelty-lens-mark.svg, for the blue-to-green rail tile. Drawn rather
    than filtered: the dot opacities are lifted (0.44-0.72 becomes 0.60-0.86) because the
    faint end of the cluster disappears against a mid-tone gradient at 34px, which is what
    a brightness(0) invert(1) filter over the colour version used to do. Geometry is
    identical to the colour cut — only fill and opacity differ.
  -->
  <circle cx="27" cy="36.5" r="19" fill="none" stroke="#FFFFFF" stroke-width="4.2"/>

  <g fill="#FFFFFF">
    <circle cx="19" cy="29.5" r="3" opacity="0.82"/>
    <circle cx="30" cy="27.5" r="2.3" opacity="0.68"/>
    <circle cx="16" cy="39.5" r="2.5" opacity="0.64"/>
    <circle cx="25" cy="37.5" r="4.2"/>
    <circle cx="34" cy="36.5" r="2.7" opacity="0.86"/>
    <circle cx="21" cy="46.5" r="2.8" opacity="0.74"/>
    <circle cx="32" cy="45.5" r="2.1" opacity="0.6"/>
  </g>

  <circle cx="50" cy="14.5" r="6.4" fill="none" stroke="#FFFFFF" stroke-width="3.4"/>
</svg>

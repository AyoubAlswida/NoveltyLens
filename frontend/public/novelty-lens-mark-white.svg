<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Novelty Lens">
  <title>Novelty Lens</title>
  <!--
    Reversed cut of novelty-lens-mark.svg, for the rail tile. Geometry is identical to the
    colour cut; the gradient strokes/fills become flat white and the scan-line's fade is
    reproduced with opacity instead of a two-stop colour gradient, since a gradient url()
    can't carry over without the purple/teal stops that don't exist on this cut.
  -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round">
    <path d="M21,10 H13.5 Q10,10 10,13.5 V21"/>
    <path d="M43,10 H50.5 Q54,10 54,13.5 V21"/>
    <path d="M21,54 H13.5 Q10,54 10,50.5 V43"/>
    <path d="M43,54 H50.5 Q54,54 54,50.5 V43"/>
  </g>

  <line x1="10" y1="32" x2="54" y2="32" stroke="#FFFFFF" stroke-width="1.4" opacity="0.5"/>

  <g fill="#FFFFFF">
    <circle cx="21.2" cy="19" r="2.8" opacity="0.86"/>
    <circle cx="28.4" cy="19" r="2.8" opacity="0.86"/>
    <circle cx="35.6" cy="19" r="2.8" opacity="0.86"/>
    <circle cx="42.8" cy="19" r="2.8" opacity="0.86"/>
    <circle cx="21.2" cy="26" r="2.8" opacity="0.86"/>
    <circle cx="28.4" cy="26" r="2.8" opacity="0.86"/>
    <circle cx="35.6" cy="26" r="2.8" opacity="0.86"/>
    <circle cx="42.8" cy="26" r="2.8" opacity="0.86"/>
    <circle cx="21.2" cy="38" r="2.8" opacity="0.86"/>
    <circle cx="28.4" cy="38" r="2.8" opacity="0.86"/>
    <circle cx="35.6" cy="38" r="2.8" opacity="0.86"/>
    <circle cx="42.8" cy="38" r="2.8" opacity="0.86"/>
    <circle cx="21.2" cy="45" r="2.8" opacity="0.86"/>
    <circle cx="28.4" cy="45" r="2.8" opacity="0.86"/>
    <circle cx="35.6" cy="45" r="2.8" opacity="0.86"/>
    <circle cx="42.8" cy="45" r="2.8" opacity="0.86"/>
  </g>

  <circle cx="32" cy="32" r="5.5" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="32" cy="32" r="3.8" fill="#FFFFFF"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Novelty Lens">
  <title>Novelty Lens</title>
  <!--
    Direction C2. Four viewfinder brackets frame the invention under focus; the dot grid
    is the corpus of prior art being scanned, split into two ranks above and below the
    centre line. The scan-line crossing the middle, fading in from both edges to a single
    focus point at 32,32, is the comparison pass that turns "prior art found" into
    "novelty score" — the one thing the product measures. Brand gradient #643278 to #26A8AB.
    Drawn on a 64-unit grid; every coordinate is optically centred on 32,32.
  -->
  <defs>
    <linearGradient id="nlGrad" gradientUnits="userSpaceOnUse" x1="6" y1="32" x2="58" y2="32">
      <stop offset="0" stop-color="#643278"/>
      <stop offset="1" stop-color="#26A8AB"/>
    </linearGradient>
    <linearGradient id="nlLineGrad" gradientUnits="userSpaceOnUse" x1="10" y1="32" x2="54" y2="32">
      <stop offset="0" stop-color="#643278" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#643278" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#26A8AB" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#26A8AB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#nlGrad)" stroke-width="3.2" stroke-linecap="round">
    <path d="M21,10 H13.5 Q10,10 10,13.5 V21"/>
    <path d="M43,10 H50.5 Q54,10 54,13.5 V21"/>
    <path d="M21,54 H13.5 Q10,54 10,50.5 V43"/>
    <path d="M43,54 H50.5 Q54,54 54,50.5 V43"/>
  </g>

  <line x1="10" y1="32" x2="54" y2="32" stroke="url(#nlLineGrad)" stroke-width="1.4"/>

  <g fill="url(#nlGrad)">
    <circle cx="21.2" cy="19" r="2.8"/>
    <circle cx="28.4" cy="19" r="2.8"/>
    <circle cx="35.6" cy="19" r="2.8"/>
    <circle cx="42.8" cy="19" r="2.8"/>
    <circle cx="21.2" cy="26" r="2.8"/>
    <circle cx="28.4" cy="26" r="2.8"/>
    <circle cx="35.6" cy="26" r="2.8"/>
    <circle cx="42.8" cy="26" r="2.8"/>
    <circle cx="21.2" cy="38" r="2.8"/>
    <circle cx="28.4" cy="38" r="2.8"/>
    <circle cx="35.6" cy="38" r="2.8"/>
    <circle cx="42.8" cy="38" r="2.8"/>
    <circle cx="21.2" cy="45" r="2.8"/>
    <circle cx="28.4" cy="45" r="2.8"/>
    <circle cx="35.6" cy="45" r="2.8"/>
    <circle cx="42.8" cy="45" r="2.8"/>
  </g>

  <circle cx="32" cy="32" r="5.5" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="3.8" fill="url(#nlGrad)"/>
</svg>

# The app has no client-side router (see CLAUDE.md), so this is plain static
# serving - no SPA fallback rewrite is needed.
#
# 8080, not 80: under OpenShift's default SCC the container runs as a non-root
# UID and cannot bind a privileged port. docker-compose.yml publishes 4200 to
# this port, so local access is unchanged.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # env-config.js is regenerated per-container-start by docker-entrypoint.sh;
    # never let it get cached like the hashed Angular bundle files can be. A
    # stale copy would silently point a redeployed frontend at the old backend.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }
}

# 8080, not 80: under OpenShift's default SCC the container is a non-root UID
# and cannot bind a privileged port.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The app is a single-page application with no router - every path must
    # return index.html and let Angular decide what to render. Without this,
    # a refresh on any URL other than / returns nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # env.js is written at container start and differs per environment, so it
    # must never be cached - a stale copy would silently point a redeployed
    # frontend at the previous backend.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # index.html is the cache-busting entry point: it names the hashed bundle
    # filenames, so caching it would pin browsers to an old build.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Everything Angular emits carries a content hash in its filename, so these
    # are safe to cache hard. Fonts are here too (public/fonts) - they are the
    # largest static payload and never change without a new build.
    location ~* \.(js|css|woff2?|otf|ttf|svg|png|jpe?g|gif|ico|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/otf;
    gzip_min_length 1024;
}

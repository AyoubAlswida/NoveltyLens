# The app has no client-side router (see CLAUDE.md), so this is plain static
# serving - no SPA fallback rewrite is needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # env-config.js is regenerated per-container-start by docker-entrypoint.sh;
    # never let it get cached like the hashed Angular bundle files can be.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }
}

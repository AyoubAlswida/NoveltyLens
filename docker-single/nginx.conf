worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server {
        listen 8080;
        server_name _;
        root /app/web;
        index index.html;
        location / { try_files $uri $uri/ =404; }
        location = /env-config.js { add_header Cache-Control "no-store"; }
        location /api/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Preserve Quick/Advanced SSE frames and reconnect headers.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location = /readyz { proxy_pass http://127.0.0.1:8001; }
        location = /healthz { proxy_pass http://127.0.0.1:8001; }
    }
}

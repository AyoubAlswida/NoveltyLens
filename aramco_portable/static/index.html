<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novelty Lens Portable</title><style>body{font:16px system-ui;max-width:950px;margin:40px auto;padding:0 20px;background:#f6f8f7;color:#16332d}textarea{width:100%;height:180px;padding:12px;box-sizing:border-box}button{margin:12px 0;padding:10px 18px;background:#007f70;color:white;border:0;border-radius:4px}pre{white-space:pre-wrap;background:white;padding:16px;border-radius:6px;overflow:auto}.error{color:#a11414}</style></head><body><h1>Novelty Lens Portable</h1><p>Local Python + SQLite. Search runs only when Lens access is available.</p><textarea id="description" placeholder="Describe the invention in technical detail..."></textarea><br><button id="run">Analyze invention</button><p id="status"></p><pre id="result"></pre><script>const status=document.querySelector('#status'),result=document.querySelector('#result');document.querySelector('#run').onclick=async()=>{status.textContent='Running the full analysis…';status.className='';result.textContent='';try{const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:document.querySelector('#description').value})}),data=await r.json();if(!r.ok)throw Error(data.error);status.textContent='Analysis saved locally.';result.textContent=JSON.stringify(data,null,2)}catch(e){status.textContent=e.message;status.className='error'}};</script></body></html>

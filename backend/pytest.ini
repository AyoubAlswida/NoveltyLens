[pytest]
testpaths = tests
pythonpath = .
markers =
    postgres: needs the Compose PostgreSQL instance. Skipped -- with the reason
        printed -- when it is unreachable or unmigrated. These tests assert
        properties of the SQL (constraints, triggers, the mandatory lock order,
        lease races, the expiry equality instant, cascades) that the in-memory
        double in tests/fakes.py structurally cannot exhibit, so a skipped run of
        them is a skipped run and never evidence that they passed.

# Credentials and the database password. NOTHING REAL BELONGS IN THIS FILE.
#
# The values below are placeholders and this file IS committed, so treat every
# one of them as public. Create the real Secret from the command line instead,
# which keeps the values out of git entirely:
#
#   oc create secret generic noveltylens-secrets \
#       --from-literal=LLM_API_KEY=sk-... \
#       --from-literal=SERPAPI_KEY=... \
#       --from-literal=AUTH_SECRET="$(python -c 'import secrets;print(secrets.token_hex(32))')" \
#       --from-literal=POSTGRES_PASSWORD="$(python -c 'import secrets;print(secrets.token_hex(16))')"
#
# AUTH_SECRET especially: config.py ships a known constant as its default, so a
# deployment that does not set it will accept a session token minted by anyone
# who has read this repository. Generate a real one, and note that rotating it
# is the ONLY way to revoke an issued token - they are stateless.
#
# EMBEDDING_API_KEY is deliberately absent: config.py falls back to LLM_API_KEY,
# and the Aramco gateway serves both from the same key. Add it only if that
# stops being true.
apiVersion: v1
kind: Secret
metadata:
  name: noveltylens-secrets
  labels:
    app.kubernetes.io/part-of: noveltylens
type: Opaque
stringData:
  LLM_API_KEY: "REPLACE_ME"
  SERPAPI_KEY: "REPLACE_ME"
  AUTH_SECRET: "REPLACE_ME_WITH_64_RANDOM_HEX_CHARS"
  POSTGRES_PASSWORD: "REPLACE_ME"
---
# Non-secret configuration. Split from the Secret so these can be read, diffed
# and reviewed freely - changing the model name should not require access to
# the credentials.
apiVersion: v1
kind: ConfigMap
metadata:
  name: noveltylens-config
  labels:
    app.kubernetes.io/part-of: noveltylens
data:
  # The pod must bind 0.0.0.0. config.py defaults to 127.0.0.1 so a laptop does
  # not expose the backend to its network; inside a pod that default would make
  # the Service report zero ready endpoints. See config.server_host.
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8001"

  LLM_API_URL: "https://dev-metabrain-api.aramco.com.sa/v1/chat/completions"
  LLM_MODEL: "minimaxm3"
  EMBEDDING_API_URL: "https://dev-metabrain-api.aramco.com.sa/v1/embeddings"
  EMBEDDING_MODEL: "Qwen3-Embedding-4B"

  # In-cluster DNS: <service>.<namespace>.svc.cluster.local, shortened to the
  # service name because these all live in one namespace. The password is
  # assembled into DATABASE_URL by the Deployment, not stored here.
  QDRANT_URL: "http://qdrant:6333"

  # The per-step trace goes to stdout, which is where OpenShift collects logs
  # from. Leave it on until the deployment is proven, then set "0".
  TRACE: "1"

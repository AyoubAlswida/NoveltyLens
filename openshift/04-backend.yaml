# The backend: FastAPI, the LangGraph pipeline, and the auth gate.
#
# Runs the database migration as a Job first. That Job is what creates the four
# tables AND seeds the demo login, so a fresh namespace has no way to sign in
# until it has completed. It is idempotent (yoyo records what it applied), so
# re-running it after adding a migration is the normal upgrade path.
apiVersion: batch/v1
kind: Job
metadata:
  name: noveltylens-migrate
  labels:
    app.kubernetes.io/part-of: noveltylens
  annotations:
    # Delete and re-apply this Job to run new migrations; a completed Job is
    # immutable, so `oc apply` alone will not re-run it.
    description: "Applies backend/migrations via yoyo. Re-create to upgrade."
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: image-registry.openshift-image-registry.svc:5000/noveltylens/backend:latest
          command: ["python", "migrate.py"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: noveltylens-db-url
                  key: DATABASE_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: noveltylens
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      containers:
        - name: backend
          image: image-registry.openshift-image-registry.svc:5000/noveltylens/backend:latest
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: noveltylens-config
            - secretRef:
                name: noveltylens-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: noveltylens-db-url
                  key: DATABASE_URL
          # /healthz answers without touching anything, /readyz checks Postgres.
          # The split matters: a database outage should pull this pod out of the
          # Service (readiness) but must NOT restart it (liveness), because a
          # restart cannot fix Postgres and would kill in-flight SSE streams.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              # Ranking holds every chunk vector of every candidate in memory as
              # Python floats. 15 candidates x 12 chunks x 2560 dims is the
              # working set to watch if this ever OOMs.
              memory: 2Gi
      # A run can take ~60s and streams SSE the whole time. The default 30s
      # grace period would cut a user's search off mid-stream on every rollout.
      terminationGracePeriodSeconds: 90
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/part-of: noveltylens
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: backend
  labels:
    app.kubernetes.io/part-of: noveltylens
  annotations:
    # A novelty run streams progress for ~60s. The default router timeout is
    # 30s, which would sever the SSE connection mid-run and surface to the user
    # as a failed search with no error - set generously.
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: backend
  port:
    targetPort: 8001
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
